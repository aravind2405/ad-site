name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    # Pinned: the ubuntu-latest label is moving to Ubuntu 26. Move up on purpose once CI passes there.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Playwright's own image already holds Chromium, WebKit and their system packages, so the job
    # downloads nothing through apt for them. Hosted runners' package mirrors have been slow enough
    # to stall the install for 20 minutes. The tag must match the pinned @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      # Read-only token provided by Actions; raises the GitHub API rate limit for the build.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the hygiene check can read this branch's commit messages.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repo hygiene
        run: npm run check:hygiene -- origin/${{ github.base_ref || 'main' }}

      - name: Metrics receipts
        run: npm run check:receipts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Cache the Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: |
          npm run build 2>&1 | tee build.log
          # Any warning fails the build, except the first run's "no build cache" notice, which the
          # cache step above removes from every later run.
          if grep -iE "warn|⚠" build.log | grep -viE "no build cache"; then
            echo "The build printed warnings (above)."
            exit 1
          fi

      - name: Privacy check on the built site
        run: npm run check:privacy

      - name: End-to-end and accessibility tests
        run: npm run e2e

      - name: Lighthouse
        # Lighthouse drives the Chromium that Playwright's image provides.
        run: |
          export CHROME_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          npm run lighthouse

      - name: Lighthouse runner speed and scores
        # Shows how fast this runner is (Lighthouse's CPU benchmark; about 1000 is a typical laptop)
        # next to each run's score, so a miss can be told apart from a slow machine.
        if: always()
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            for (const form of ['mobile', 'desktop']) {
              const dir = path.join('.lighthouseci', form);
              if (!fs.existsSync(dir)) continue;
              for (const f of fs.readdirSync(dir).filter((n) => n.endsWith('.report.json'))) {
                const r = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
                const a = r.audits;
                console.log(form, new URL(r.finalUrl).pathname.padEnd(20), 'perf', r.categories.performance.score,
                  'benchmark', r.environment.benchmarkIndex, 'LCP', Math.round(a['largest-contentful-paint'].numericValue),
                  'TBT', Math.round(a['total-blocking-time'].numericValue), 'CLS', a['cumulative-layout-shift'].numericValue);
              }
            }"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          # .lighthouseci is a hidden folder, which the upload action skips unless told otherwise.
          include-hidden-files: true
          retention-days: 7
