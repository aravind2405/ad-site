name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    # Pinned: the ubuntu-latest label is moving to Ubuntu 26. Move up on purpose once CI passes there
    # (the Playwright browser install is the part most likely to be sensitive to the OS).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Read-only token provided by Actions; raises the GitHub API rate limit for the build.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the hygiene check can read this branch's commit messages.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repo hygiene
        run: npm run check:hygiene -- origin/${{ github.base_ref || 'main' }}

      - name: Metrics receipts
        run: npm run check:receipts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Cache the Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: |
          npm run build 2>&1 | tee build.log
          # Any warning fails the build, except the first run's "no build cache" notice, which the
          # cache step above removes from every later run.
          if grep -iE "warn|⚠" build.log | grep -viE "no build cache"; then
            echo "The build printed warnings (above)."
            exit 1
          fi

      - name: Privacy check on the built site
        run: npm run check:privacy

      - name: Install browsers
        # A hosted runner's package mirror is sometimes very slow. apt is told to time out and
        # retry stalled downloads, each attempt is capped, and a stuck apt-get left by a timed-out
        # attempt is cleared before the next one so it cannot hold the package lock.
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-retries >/dev/null
          for attempt in 1 2 3; do
            if timeout 420 npx playwright install --with-deps chromium webkit; then exit 0; fi
            echo "Browser install attempt $attempt failed or timed out."
            sudo pkill -x apt-get || true
            sudo pkill -x dpkg || true
            sleep 5
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: End-to-end and accessibility tests
        run: npm run e2e

      - name: Lighthouse
        run: npm run lighthouse

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
